<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="lightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Lightbulb body (background idea element) -->
  <g opacity="0.3">
    <path d="M 100 30 Q 115 45 115 65 Q 115 85 100 90 L 100 90 Q 85 85 85 65 Q 85 45 100 30 Z" fill="url(#lightGrad)"/>
    <rect x="92" y="90" width="16" height="8" fill="url(#lightGrad)" rx="2"/>
  </g>
  
  <!-- Robot head - rounded square -->
  <g transform="translate(100, 100)">
    <!-- Head body -->
    <rect x="-35" y="-35" width="70" height="70" rx="15" fill="url(#bodyGrad)" stroke="white" stroke-width="2"/>
    
    <!-- Left eye - smart glass effect -->
    <g>
      <!-- Glass frame -->
      <rect x="-24" y="-18" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
      <!-- Glowing pupil -->
      <circle cx="-16" cy="-10" r="5" fill="white"/>
      <circle cx="-16" cy="-10" r="3" fill="#3b82f6"/>
      <!-- Tech sparkle -->
      <circle cx="-12" cy="-14" r="1.5" fill="white"/>
    </g>
    
    <!-- Right eye - smart glass effect -->
    <g>
      <!-- Glass frame -->
      <rect x="8" y="-18" width="16" height="16" rx="4" fill="none" stroke="white" stroke-width="2.5"/>
      <!-- Glowing pupil -->
      <circle cx="16" cy="-10" r="5" fill="white"/>
      <circle cx="16" cy="-10" r="3" fill="#8b5cf6"/>
      <!-- Tech sparkle -->
      <circle cx="20" cy="-14" r="1.5" fill="white"/>
    </g>
    
    <!-- Bridge between glasses -->
    <line x1="-8" y1="-10" x2="8" y2="-10" stroke="white" stroke-width="2"/>
    
    <!-- Friendly smile -->
    <path d="M -15 8 Q 0 18 15 8" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    
    <!-- Left antenna -->
    <line x1="-28" y1="-38" x2="-28" y2="-48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="-28" cy="-50" r="3" fill="white"/>
    
    <!-- Right antenna -->
    <line x1="28" y1="-38" x2="28" y2="-48" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <circle cx="28" cy="-50" r="3" fill="white"/>
    
    <!-- Graduation cap on top - overlapping -->
    <g transform="translate(0, -50)">
      <!-- Cap square -->
      <rect x="-18" y="-8" width="36" height="8" fill="url(#bodyGrad)" stroke="white" stroke-width="1.5"/>
      <!-- Cap top circle/ball -->
      <circle cx="0" cy="-10" r="6" fill="url(#bodyGrad)" stroke="white" stroke-width="1.5"/>
      <!-- Tassel -->
      <line x1="0" y1="-4" x2="0" y2="8" stroke="#fbbf24" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="9" r="2" fill="#fbbf24"/>
    </g>
    
    <!-- Chest light indicator (idea bulb mini) -->
    <circle cx="0" cy="25" r="6" fill="url(#lightGrad)" opacity="0.8" filter="url(#glow)"/>
    <circle cx="0" cy="25" r="4" fill="#fbbf24" opacity="0.6"/>
  </g>
  
  <!-- Outer glow ring -->
  <circle cx="100" cy="100" r="92" fill="none" stroke="url(#bodyGrad)" stroke-width="1.5" opacity="0.3"/>
</svg>